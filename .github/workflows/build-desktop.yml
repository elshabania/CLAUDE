name: Build STEAM 2040 Studio desktop executables

# Builds standalone executables for Windows (.exe), macOS and Linux from the
# steam2040/ PyInstaller spec and publishes them to a GitHub Release you can
# download with one click (Repo -> Releases -> "STEAM 2040 Studio (latest)").
#
# Triggers automatically on every push to the development branch, on a steam-v*
# tag, or manually from the Actions tab.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/new-session-6b5r6c"
    tags:
      - "steam-v*"
    paths:
      - "steam2040/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: write          # publish the Release

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: steam2040
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            osname: windows
          - os: macos-latest
            osname: macos
          - os: ubuntu-latest
            osname: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Sanity-check the engine (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build one-folder app (web)
        run: pyinstaller --noconfirm --clean packaging/steam_web.spec

      - name: Zip the build
        shell: bash
        run: |
          python -c "import shutil; shutil.make_archive('STEAM2040Studio-${{ matrix.osname }}', 'zip', 'dist', 'STEAM2040Studio')"
          ls -lh STEAM2040Studio-${{ matrix.osname }}.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: STEAM2040Studio-${{ matrix.osname }}
          path: steam2040/STEAM2040Studio-${{ matrix.osname }}.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'desktop-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'STEAM 2040 Studio (latest)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            STEAM 2040 Studio — standalone builds (no Python needed). Each zip is a
            one-folder app; unzip it and run **STEAM2040Studio** inside. It starts a
            local server and opens the app in your browser. Runs entirely on your
            machine, offline.

            * **STEAM2040Studio-windows.zip** — Windows (run `STEAM2040Studio.exe`)
            * **STEAM2040Studio-macos.zip** — macOS
            * **STEAM2040Studio-linux.zip** — Linux

            **Windows SmartScreen / Defender note:** the app is unsigned (code signing
            needs a paid certificate), so Windows may warn on first run — click
            **More info → Run anyway**. This is a false positive: the full source is in
            this repository and the app only talks to `localhost`. The one-folder zip is
            far less likely to be flagged than a one-file installer. If you prefer zero
            warnings, run from source instead (`pip install -r requirements.txt` then
            `python steam_web.py`).

            Point it at your data with the `STEAM_DATA_DIR` environment variable.
            Built from commit ${{ github.sha }}.
          files: release/*
