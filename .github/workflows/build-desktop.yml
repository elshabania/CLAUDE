name: Build STEAM 2040 Studio desktop executables

# Produces standalone executables for Windows (.exe), macOS and Linux from the
# steam2040/ PyInstaller spec. Download them from the run's Artifacts section,
# or — when triggered by a v* tag — from the published GitHub Release.
#
# Run it manually: Actions tab -> "Build STEAM 2040 Studio desktop executables"
# -> Run workflow. Or push a tag like steam-v0.1.0 to also cut a Release.

on:
  workflow_dispatch:
  push:
    tags:
      - "steam-v*"

defaults:
  run:
    working-directory: steam2040

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: STEAM2040Studio-windows
            binary: dist/STEAM2040Studio.exe
          - os: macos-latest
            artifact: STEAM2040Studio-macos
            binary: dist/STEAM2040Studio
          - os: ubuntu-latest
            artifact: STEAM2040Studio-linux
            binary: dist/STEAM2040Studio

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sanity-check the engine (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install pytest
          pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/steam_studio.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: steam2040/${{ matrix.binary }}
          if-no-files-found: error

      - name: Attach to release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/steam-v')
        uses: softprops/action-gh-release@v2
        with:
          files: steam2040/${{ matrix.binary }}
