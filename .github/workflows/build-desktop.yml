name: Build STEAM 2040 Studio desktop executables

# Builds standalone executables for Windows (.exe), macOS and Linux from the
# steam2040/ PyInstaller spec and publishes them to a GitHub Release you can
# download with one click (Repo -> Releases -> "STEAM 2040 Studio (latest)").
#
# Triggers automatically on every push to the development branch, on a steam-v*
# tag, or manually from the Actions tab.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/new-session-6b5r6c"
    tags:
      - "steam-v*"
    paths:
      - "steam2040/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: write          # publish the Release

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: steam2040
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: STEAM2040Studio-windows
            built: dist/STEAM2040Studio.exe
            release_name: STEAM2040Studio.exe
          - os: macos-latest
            artifact: STEAM2040Studio-macos
            built: dist/STEAM2040Studio
            release_name: STEAM2040Studio-macos
          - os: ubuntu-latest
            artifact: STEAM2040Studio-linux
            built: dist/STEAM2040Studio
            release_name: STEAM2040Studio-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Sanity-check the engine (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build executable (web app)
        run: pyinstaller --noconfirm --clean packaging/steam_web.spec

      - name: Rename for release
        shell: bash
        run: cp "${{ matrix.built }}" "${{ matrix.release_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: steam2040/${{ matrix.release_name }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'desktop-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'STEAM 2040 Studio (latest)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            Standalone STEAM 2040 Studio desktop builds — download and run, no Python needed.

            * **STEAM2040Studio.exe** — Windows
            * **STEAM2040Studio-macos** — macOS (`chmod +x`, then run)
            * **STEAM2040Studio-linux** — Linux (`chmod +x`, then run)

            On first launch Windows SmartScreen may warn about an unsigned app — "More info → Run anyway".
            Built from commit ${{ github.sha }}.
          files: release/*
