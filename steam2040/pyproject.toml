[project]
name = "steam2040-studio"
version = "0.1.0"
description = "STEAM 2040 Studio — traffic assignment + zone aggregation desktop app for the Abu Dhabi STEAM 2040 network, with an in-app AI assistant."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyshp>=2.3",
    "numba>=0.59",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "PySide6>=6.6",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pyinstaller>=6.0", "httpx>=0.26"]

[project.scripts]
steam-web = "steam_web:main"
steam-studio = "steam_app.gui:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["steam_core", "steam_assignment", "steam_viewer", "steam_app",
            "steam_app.gui", "steam_app.web", "tools"]
