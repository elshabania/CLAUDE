[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-ai"
version = "0.1.0"
description = "STEAM-AI: post-run diagnostics, forecasting and reporting layer for ITC STEAM v4"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "duckdb>=0.10",
  "pyyaml>=6",
  "jsonschema>=4.21",
  "typer>=0.12",
  "watchdog>=4",
  "python-docx>=1.1",
  "reportlab>=4.1",
  "matplotlib>=3.8",
  "shapely>=2.0",
  "dbfread>=2.0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.9", "httpx>=0.27"]

[project.scripts]
steam-ai = "steam_ai.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["steam_ai*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP017", "UP042", "B904", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
