# KPI definitions. Each is a DuckDB query over the internal tables. Every KPI
# shown in the UI cites this file and its query.
kpis:
  - id: total_vkt_am
    name: Vehicle-km travelled, AM
    unit: veh-km
    definition: Sum of link volume x length for user_class ALL in the AM period.
    sql: >
      SELECT SUM(f.volume * l.length_m / 1000.0) AS value
      FROM link_flows f JOIN links l USING (link_id)
      WHERE f.period = 'AM' AND f.user_class = 'ALL'
  - id: share_links_over_capacity_am
    name: Share of links with V/C above 1.0, AM
    unit: share
    definition: Links with vc_ratio > 1.0 divided by all links carrying flow, AM, user_class ALL.
    sql: >
      SELECT AVG(CASE WHEN vc_ratio > 1.0 THEN 1.0 ELSE 0.0 END) AS value
      FROM link_flows WHERE period = 'AM' AND user_class = 'ALL' AND volume > 0
  - id: mean_cong_speed_am
    name: Volume-weighted congested speed, AM
    unit: km/h
    definition: Sum(volume x congested speed) / Sum(volume) for AM, user_class ALL.
    sql: >
      SELECT SUM(volume * cong_speed_kph) / NULLIF(SUM(volume), 0) AS value
      FROM link_flows WHERE period = 'AM' AND user_class = 'ALL'
  - id: total_trips_am
    name: Total demand trips, AM
    unit: trips
    definition: Sum of all DEMAND matrix cells in the AM period, all purposes and modes.
    sql: >
      SELECT SUM(trips) AS value FROM od WHERE matrix_kind = 'DEMAND' AND period = 'AM'
  - id: pt_share_am
    name: PT mode share, AM
    unit: share
    definition: PT demand trips divided by all demand trips, AM.
    sql: >
      SELECT SUM(CASE WHEN mode = 'PT' THEN trips ELSE 0 END) / NULLIF(SUM(trips), 0) AS value
      FROM od WHERE matrix_kind = 'DEMAND' AND period = 'AM'
  - id: mean_trip_length_km
    name: Mean trip length, all periods
    unit: km
    definition: Trip-weighted mean of the DIST skim (metres, per data contract 8.3) over DEMAND matrix cells, converted to km.
    sql: >
      SELECT SUM(o.trips * s.value) / NULLIF(SUM(o.trips), 0) / 1000.0 AS value
      FROM od o JOIN skims s
        ON s.skim_kind = 'DIST' AND s.mode = o.mode AND s.period = o.period
       AND s.origin = o.origin AND s.destination = o.destination
      WHERE o.matrix_kind = 'DEMAND'
  - id: network_km
    name: Link length, each direction
    unit: km
    definition: Sum of link length over all highway links (each direction counted).
    sql: >
      SELECT SUM(length_m) / 1000.0 AS value FROM links
  - id: lane_km
    name: Lane-km, all roads
    unit: lane-km
    definition: Sum of link length x lanes over all highway links.
    sql: >
      SELECT SUM(length_m * lanes) / 1000.0 AS value FROM links
  - id: fwy_lane_km
    name: Lane-km, freeways
    unit: lane-km
    definition: Sum of link length x lanes over links of class FWY.
    sql: >
      SELECT SUM(length_m * lanes) / 1000.0 AS value FROM links WHERE link_class = 'FWY'
  - id: daily_trips
    name: Total demand trips, all periods
    unit: trips
    definition: Sum of all DEMAND matrix cells, every purpose, mode and period.
    sql: >
      SELECT SUM(trips) AS value FROM od WHERE matrix_kind = 'DEMAND'
  - id: population
    name: Population
    unit: people
    definition: Sum of the POP land-use variable over all zones.
    sql: >
      SELECT SUM(value) AS value FROM land_use WHERE variable = 'POP'
